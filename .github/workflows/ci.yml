name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jober
          POSTGRES_PASSWORD: jober
          POSTGRES_DB: jober
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jober -d jober"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://jober:jober@localhost:5432/jober?ssl=disable
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: jober-artifacts
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO failed to become healthy" >&2
          exit 1

      - name: Install MinIO client and create bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
          chmod +x mc
          ./mc alias set local http://localhost:9000 minioadmin minioadmin
          ./mc mb local/jober-artifacts --ignore-existing

      - name: Install API dependencies
        run: pip install "./apps/api[dev]"

      - name: Ruff (api)
        working-directory: apps/api
        run: ruff check src tests

      - name: Mypy (api)
        working-directory: apps/api
        run: mypy src

      - name: Pytest (api)
        working-directory: apps/api
        run: pytest -q

      - name: Install worker dependencies
        run: pip install "./apps/worker[dev]"

      - name: Ruff (worker)
        run: ruff check apps/worker/src apps/worker/tests

      - name: Mypy (worker)
        run: mypy apps/worker/src

      - name: Pytest (worker)
        run: pytest -q apps/worker/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web checks (stub — Mission 02)
        run: |
          echo "apps/web is a placeholder until Mission 02 scaffolds Next.js."
          test -f apps/web/.gitkeep
