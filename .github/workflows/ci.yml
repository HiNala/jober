name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jober
          POSTGRES_PASSWORD: jober
          POSTGRES_DB: jober
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jober -d jober"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://jober:jober@localhost:5432/jober?ssl=disable
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: jober-artifacts
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      VAULT_ENCRYPTION_KEY: "w-CndrrLpumBk62xq-1SBueyOre-DhzV_gGc86LmvnQ="
      CI: "true"
      FIXTURE_ATS_PORT: "8765"
      PLAYWRIGHT_HEADED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO failed to become healthy" >&2
          exit 1

      - name: Install MinIO client and create bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
          chmod +x mc
          ./mc alias set local http://localhost:9000 minioadmin minioadmin
          ./mc mb local/jober-artifacts --ignore-existing

      - name: detect-secrets
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --baseline .secrets.baseline

      - name: Install shared packages and dependencies
        run: |
          pip install "./packages/schemas"
          pip install "./packages/extraction"
          pip install "./packages/forms"
          pip install "./packages/fill"
          pip install "./packages/verification"
          pip install "./packages/recovery"
          pip install "./fixtures/ats"
          pip install "./apps/worker[dev]"
          pip install "./apps/api[dev]"
          playwright install chromium

      - name: Export shared TypeScript types
        run: python packages/schemas/scripts/export_typescript.py

      - name: Alembic migrate and drift check
        working-directory: apps/api
        run: |
          alembic upgrade head
          python scripts/check_migration_drift.py
          alembic downgrade base
          alembic upgrade head

      - name: Ruff (api)
        working-directory: apps/api
        run: ruff check src tests

      - name: Mypy (api)
        working-directory: apps/api
        run: mypy src

      - name: Pytest packages
        run: |
          pytest -q packages/verification/tests
          pytest -q packages/recovery/tests
          pytest -q fixtures/ats/tests

      - name: Pytest (api) with coverage
        working-directory: apps/api
        run: pytest -q --cov=jober_api --cov-report=xml --cov-report=term-missing

      - name: Ruff (worker)
        working-directory: apps/worker
        run: ruff check src tests

      - name: Mypy (worker)
        working-directory: apps/worker
        run: mypy src

      - name: Pytest (worker)
        working-directory: apps/worker
        run: pytest -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            apps/worker/test-results
            apps/api/test-results
          if-no-files-found: ignore

  policy:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jober
          POSTGRES_PASSWORD: jober
          POSTGRES_DB: jober
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jober -d jober"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jober:jober@localhost:5432/jober?ssl=disable
      VAULT_ENCRYPTION_KEY: "w-CndrrLpumBk62xq-1SBueyOre-DhzV_gGc86LmvnQ="
      CI: "true"
      FIXTURE_ATS_PORT: "8765"
      PLAYWRIGHT_HEADED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "./packages/schemas" "./packages/extraction" "./packages/forms"
          pip install "./packages/fill" "./packages/verification" "./packages/recovery"
          pip install "./fixtures/ats" "./apps/worker[dev]" "./apps/api[dev]"
          playwright install chromium
      - name: Alembic migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: Policy tests (blocking)
        working-directory: apps/api
        run: pytest -q -m policy

  quarantine:
    runs-on: ubuntu-latest
    needs: backend
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jober
          POSTGRES_PASSWORD: jober
          POSTGRES_DB: jober
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jober -d jober"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jober:jober@localhost:5432/jober?ssl=disable
      VAULT_ENCRYPTION_KEY: "w-CndrrLpumBk62xq-1SBueyOre-DhzV_gGc86LmvnQ="
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "./packages/schemas" "./packages/extraction" "./packages/forms"
          pip install "./packages/fill" "./packages/verification" "./packages/recovery"
          pip install "./fixtures/ats" "./apps/api[dev]"
      - name: Alembic migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: Quarantined flaky tests (non-blocking)
        working-directory: apps/api
        run: pytest -q -m quarantine

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (strict)
        run: pnpm lint:strict

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
