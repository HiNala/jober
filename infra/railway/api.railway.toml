# Railway service config — API (attach in service Settings → Config path).
# Build context is the monorepo root (shared packages/).

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "infra/docker/Dockerfile.api",
  "infra/docker/api-entrypoint.sh",
]

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
