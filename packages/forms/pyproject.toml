[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jober-forms"
version = "0.1.0"
description = "Form discovery, field mapping, and confidence policy for Jober"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "jober-schemas",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jober_forms"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
