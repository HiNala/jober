[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jober-verify"
version = "0.1.0"
description = "Jober readiness verification and submission classification"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/jober_verify"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "playwright==1.49.1",
]
