[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jober-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas for Jober API and web"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy==2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jober_schemas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts"]
