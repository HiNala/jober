[project]
name = "jober-tui"
version = "0.1.0"
description = "Interactive Rich TUI for Jober runs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "rich>=13.9.0",
]

[project.scripts]
jober-tui = "jober_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jober_tui"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
