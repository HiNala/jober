[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jober-api"
version = "0.1.0"
description = "Jober API — assisted application autopilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "minio>=7.2.12",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.5",
    "jober-schemas",
    "jober-extraction",
    "jober-forms",
    "jober-fill",
    "jober-verify",
    "jober-recover",
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",
    "stripe>=11.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
observability = [
    "sentry-sdk[fastapi]>=2.19.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy==2.1.0",
    "types-redis>=4.6.0",
    "playwright==1.49.1",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jober_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/jober_api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["jober_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "minio.*",
    "openpyxl.*",
    "pypdf.*",
    "docx.*",
    "reportlab.*",
    "jober_extraction.*",
    "jober_forms.*",
    "jober_fill.*",
    "jober_worker.*",
    "jober_schemas.*",
    "celery",
    "celery.*",
    "sentry_sdk",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "policy: blocking safety invariant tests",
    "quarantine: flaky tests excluded from default CI",
    "load: lightweight concurrent load smoke tests",
    "no_db: unit tests that skip database seeding",
]
addopts = "-m 'not quarantine'"

[tool.coverage.run]
source = ["jober_api"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 58
show_missing = true
