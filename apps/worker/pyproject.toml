[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jober-worker"
version = "0.1.0"
description = "Jober worker — Celery + Playwright browser runner"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "playwright==1.49.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "minio>=7.2.12",
    "cryptography>=43.0.0",
    "jober-extraction",
    "jober-schemas",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy==2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jober_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["jober_worker"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
