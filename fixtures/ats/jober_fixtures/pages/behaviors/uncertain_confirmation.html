<!DOCTYPE html>
<html>
<body>
  <form id="app-form">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required value="ada@example.com" />
    <button type="submit" id="submit-btn">Submit application</button>
  </form>
  <div id="confirmation" hidden>
    <p>Your request is being processed. Please check your email for confirmation.</p>
  </div>
  <script>
    document.getElementById("app-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("app-form").style.display = "none";
      document.getElementById("confirmation").hidden = false;
    });
  </script>
</body>
</html>
