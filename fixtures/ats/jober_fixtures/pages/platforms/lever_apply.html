<!DOCTYPE html>
<html lang="en">
<body class="lever-application">
  <div class="posting-header"><h1>Backend Engineer</h1></div>
  <form class="application-form">
    <label for="lever-email">Email address</label>
    <input id="lever-email" name="email" type="email" required />

    <input id="lever-name" name="name" type="text" required />

  </form>
</body>
</html>
