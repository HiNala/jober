[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jober-fixtures"
version = "0.1.0"
description = "Synthetic ATS fixture pages and local test server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
jober-fixtures-serve = "jober_fixtures.server:main"

[tool.hatch.build.targets.wheel]
packages = ["jober_fixtures"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
